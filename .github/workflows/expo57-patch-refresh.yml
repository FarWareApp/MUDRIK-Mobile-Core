name: Expo 57 Patch Refresh

on:
  push:
    branches:
      - mudrik-core-v1
    paths:
      - .github/workflows/expo57-patch-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: mudrik-core-v1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: yarn

      - name: Align Expo SDK 57 patch versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.dependencies.expo = '~57.0.23';
          pkg.dependencies['expo-image-picker'] = '~57.0.18';
          pkg.dependencies['expo-notifications'] = '~57.0.19';
          fs.writeFileSync('package.json', `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          yarn install --ignore-scripts --non-interactive
          git diff --check

      - name: Commit generated manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add package.json yarn.lock
          if git diff --cached --quiet; then
            echo 'No dependency changes were required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Align Expo SDK 57 patch dependencies'
          git push origin HEAD:mudrik-core-v1
