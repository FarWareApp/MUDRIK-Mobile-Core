name: CodeQL Security Analysis

on:
  push:
    branches:
      - mudrik-core-v1
  pull_request:
    branches:
      - mudrik-core-v1
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: javascript-typescript
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        # actions/checkout v7.0.1, pinned for supply-chain reproducibility.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          category: /language:javascript-typescript
