name: Android Device Validation APK

on:
  workflow_dispatch:
  push:
    branches:
      - mudrik-core-v1
    paths:
      - '.github/device-validation.trigger'

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: section01-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout exact candidate
        # actions/checkout v7.0.1, pinned for supply-chain reproducibility.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node v7.0.0, pinned for supply-chain reproducibility.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'

      - name: Setup Java 17
        # actions/setup-java v6.0.1, pinned for supply-chain reproducibility.
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install frozen dependencies
        run: ./scripts/install-frozen-dependencies.sh

      - name: Verify candidate preflight
        env:
          SECTION01_EXPECTED_SHA: ${{ github.sha }}
        run: yarn device:preflight

      - name: Generate Android native project
        env:
          CI: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build app-owned standalone APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify APK and create evidence metadata
        shell: bash
        run: |
          set -euo pipefail

          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"

          mkdir -p section01-apk
          OUT="section01-apk/mudrik-section01-${GITHUB_SHA}.apk"
          cp "$APK" "$OUT"

          APK_SHA256="$(sha256sum "$OUT" | awk '{print $1}')"
          APK_BYTES="$(stat -c '%s' "$OUT")"
          ANDROID_PACKAGE="$(node -p "require('./app.json').expo.android.package")"
          APP_VERSION="$(node -p "require('./app.json').expo.version")"

          cat > section01-apk/build-metadata.json <<EOF
          {
            "candidateSha": "${GITHUB_SHA}",
            "branch": "${GITHUB_REF_NAME}",
            "workflowRunId": "${GITHUB_RUN_ID}",
            "workflowRunNumber": "${GITHUB_RUN_NUMBER}",
            "appVersion": "${APP_VERSION}",
            "androidPackage": "${ANDROID_PACKAGE}",
            "buildKind": "github-actions-standalone-release-apk",
            "apkFile": "mudrik-section01-${GITHUB_SHA}.apk",
            "apkSha256": "${APK_SHA256}",
            "apkBytes": ${APK_BYTES}
          }
          EOF

          printf '%s  %s\n' "$APK_SHA256" "mudrik-section01-${GITHUB_SHA}.apk" > section01-apk/SHA256SUMS
          cat section01-apk/build-metadata.json
          cat section01-apk/SHA256SUMS

      - name: Attest APK build provenance
        # actions/attest-build-provenance v4.2.2, pinned for supply-chain reproducibility.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: section01-apk/*.apk

      - name: Upload traceable APK artifact
        # actions/upload-artifact v7.0.1, pinned for supply-chain reproducibility.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mudrik-section01-android-${{ github.sha }}
          path: section01-apk/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
