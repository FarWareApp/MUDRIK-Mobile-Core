name: One-time Toolchain Lock Refresh

on:
  push:
    branches:
      - mudrik-core-v1
    paths:
      - package.json
      - .github/workflows/pin-toolchain-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: mudrik-core-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate lockfile from pinned package manifest
        run: yarn install --non-interactive

      - name: Verify pinned lint versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.devDependencies?.eslint !== '9.39.5') {
            throw new Error('Unexpected ESLint version');
          }
          if (pkg.devDependencies?.['eslint-config-expo'] !== '57.0.2') {
            throw new Error('Unexpected eslint-config-expo version');
          }
          NODE
          yarn why eslint
          yarn why eslint-config-expo

      - name: Commit generated lockfile only
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- yarn.lock; then
            echo 'yarn.lock already matches package.json.'
            exit 0
          fi

          git config user.name 'FarWareApp CI'
          git config user.email 'actions@users.noreply.github.com'
          git add yarn.lock
          git commit -m 'lock compatible lint toolchain'
          git push origin HEAD:mudrik-core-v1
