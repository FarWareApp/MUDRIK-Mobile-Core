name: Mobile Core Validation

on:
  push:
    branches:
      - mudrik-core-v1
  pull_request:
    branches:
      - mudrik-core-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        # actions/checkout v5, pinned for supply-chain reproducibility.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Setup Node
        # actions/setup-node v5, pinned for supply-chain reproducibility.
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'

      - name: Install frozen dependencies
        run: ./scripts/install-frozen-dependencies.sh

      - name: Verify dependency manifest is reproducible
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package.json yarn.lock
          node <<'NODE'
          const pkg = require('./package.json');
          if (pkg.devDependencies?.eslint !== '9.39.5') {
            throw new Error('Unexpected ESLint version');
          }
          if (pkg.devDependencies?.['eslint-config-expo'] !== '57.0.2') {
            throw new Error('Unexpected eslint-config-expo version');
          }
          NODE

      - name: Android device build configuration gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          if (eas?.cli?.requireCommit !== true) {
            throw new Error('eas.json must require a committed working tree for device validation builds');
          }

          const profile = eas?.build?.['device-validation'];
          if (!profile) {
            throw new Error('Missing EAS device-validation build profile');
          }
          if (profile.distribution !== 'internal') {
            throw new Error('device-validation must use internal distribution');
          }
          if (profile?.android?.buildType !== 'apk') {
            throw new Error('device-validation must produce an Android APK');
          }

          if (pkg?.scripts?.['device:preflight'] !== 'node ./scripts/section01-device-preflight.mjs') {
            throw new Error('Section 01 device preflight command is missing or changed unexpectedly');
          }
          if (!fs.existsSync('scripts/section01-device-preflight.mjs')) {
            throw new Error('Section 01 device preflight script is missing');
          }

          const androidPackage = app?.expo?.android?.package;
          if (androidPackage !== undefined) {
            const pattern = /^[A-Za-z][A-Za-z0-9_]*(?:\.[A-Za-z][A-Za-z0-9_]*)+$/;
            if (typeof androidPackage !== 'string' || !pattern.test(androidPackage)) {
              throw new Error(`Invalid expo.android.package: ${androidPackage}`);
            }
            console.log(`Android application ID configured: ${androidPackage}`);
          } else {
            console.log('Android application ID is intentionally not selected yet; final device preflight will block until it is committed.');
          }
          NODE

      - name: Tracked sensitive file gate
        shell: bash
        run: |
          set -euo pipefail
          sensitive=()

          while IFS= read -r file; do
            case "$file" in
              .env.example|*/.env.example|.env.*.example|*/.env.*.example)
                continue
                ;;
            esac

            if [[ "$file" =~ (^|/)\.env($|\.) ]] || \
               [[ "$file" =~ \.(jks|keystore|p8|p12|pfx|pem|key)$ ]]; then
              sensitive+=("$file")
            fi
          done < <(git ls-files)

          if (( ${#sensitive[@]} > 0 )); then
            printf '::error::Sensitive files are tracked by Git:\n'
            printf ' - %s\n' "${sensitive[@]}"
            exit 1
          fi

          echo 'No tracked environment/private-key files detected.'

      - name: Full Git history secret scan
        shell: bash
        run: |
          set -euo pipefail

          SK_PREFIX='s''k-'
          GHP_PREFIX='g''hp_'
          PAT_PREFIX='github''_pat_'
          GOOGLE_PREFIX='AI''za'
          AWS_PREFIX='AK''IA'
          SLACK_PREFIX='xox''b-'
          GROQ_PREFIX='g''sk_'
          PRIVATE_KEY='BEGIN ([A-Z0-9]+ )?PRIVATE KEY'

          PATTERN="${SK_PREFIX}[A-Za-z0-9_-]{20,}|${GHP_PREFIX}[A-Za-z0-9]{20,}|${PAT_PREFIX}[A-Za-z0-9_]{20,}|${GOOGLE_PREFIX}[A-Za-z0-9_-]{20,}|${AWS_PREFIX}[A-Z0-9]{16}|${SLACK_PREFIX}[A-Za-z0-9-]{20,}|${GROQ_PREFIX}[A-Za-z0-9_-]{20,}|${PRIVATE_KEY}"

          # These are deliberately synthetic credential-shaped strings used only
          # to prove telemetry redaction. Keep the allowlist exact and path-bound;
          # never exempt an entire test file from secret scanning.
          SYNTHETIC_ONE="${SK_PREFIX}1234567890abcdefghijklmnop"
          SYNTHETIC_TWO="${SK_PREFIX}plaintext-secret-value"
          SYNTHETIC_PATH='test/mobile-core/security-foundation.test.mjs'

          while read -r commit; do
            matches="$(git grep -nI -E "$PATTERN" "$commit" -- . || true)"
            [[ -z "$matches" ]] && continue

            while IFS= read -r hit; do
              rest="${hit#${commit}:}"
              path="${rest%%:*}"
              rest="${rest#*:}"
              line_no="${rest%%:*}"
              content="${rest#*:}"

              sanitized="$content"
              if [[ "$path" == "$SYNTHETIC_PATH" ]]; then
                sanitized="${sanitized//$SYNTHETIC_ONE/}"
                sanitized="${sanitized//$SYNTHETIC_TWO/}"
              fi

              if printf '%s\n' "$sanitized" | grep -qE "$PATTERN"; then
                echo "::error::Potential credential/private-key pattern detected in Git history at commit $commit, path $path, line $line_no"
                exit 1
              fi
            done <<< "$matches"
          done < <(git rev-list --all)

          echo "Full Git history secret scan passed."

      - name: Dependency audit - High/Critical gate
        shell: bash
        run: |
          set -euo pipefail

          yarn audit --groups dependencies --json > /tmp/yarn-audit.jsonl || true

          node <<'NODE'
          const fs = require('fs');
          const lines = fs.readFileSync('/tmp/yarn-audit.jsonl', 'utf8')
            .split(/\r?\n/)
            .filter(Boolean);

          const counts = {
            info: 0,
            low: 0,
            moderate: 0,
            high: 0,
            critical: 0,
          };

          const seen = new Set();
          const advisories = [];

          for (const line of lines) {
            let record;
            try {
              record = JSON.parse(line);
            } catch {
              continue;
            }

            if (record.type !== 'auditAdvisory') {
              continue;
            }

            const advisory = record.data?.advisory;
            if (!advisory) {
              continue;
            }

            const key = String(advisory.id ?? advisory.url ?? JSON.stringify(advisory));
            if (seen.has(key)) {
              continue;
            }
            seen.add(key);

            const severity = String(advisory.severity ?? '').toLowerCase();
            if (severity in counts) {
              counts[severity] += 1;
            }

            advisories.push({
              severity,
              module: advisory.module_name ?? 'unknown',
              title: advisory.title ?? 'untitled advisory',
              url: advisory.url ?? '',
            });
          }

          console.log('Dependency vulnerability counts:', counts);
          for (const advisory of advisories) {
            console.log(
              `[${advisory.severity}] ${advisory.module}: ${advisory.title}${advisory.url ? ` (${advisory.url})` : ''}`,
            );
          }

          if (counts.critical > 0 || counts.high > 0) {
            console.error(
              `Blocking dependency vulnerabilities detected: ${counts.critical} critical, ${counts.high} high.`,
            );
            process.exit(1);
          }
          NODE

      - name: Reviewed advisory dependency paths
        shell: bash
        run: |
          set -euo pipefail
          yarn why uuid || true
          yarn why decode-uri-component || true

      - name: Lint
        run: yarn lint

      - name: TypeScript
        run: yarn typecheck

      - name: Mobile Core security regression tests
        run: node --test test/mobile-core/*.test.mjs

      - name: Expo Doctor
        run: npx --yes expo-doctor@1.20.4

      - name: Computer Agent Phase 0 tests
        run: node --test computer-agent/test/*.test.mjs
